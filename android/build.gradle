apply plugin: 'com.android.library'
group = 'com.sean.rao.ali_auth'
version = '1.4.4'

buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
//        google()
//        jcenter()
        maven { url = uri('https://dl.bintray.com/jetbrains/anko') }
        maven { url = uri('https://download.flutter.io') }
        maven { url = uri('https://maven.aliyun.com/repository/public') }
        maven { url = uri('https://maven.aliyun.com/repository/google') }
    }

    dependencies {
        // 本地插件与 Flutter 3.44.9 宿主统一使用 AGP 8.13.2，避免独立构建
        // 继续加载已淘汰的 AGP 4.x；该插件没有 Kotlin 源码，因此不额外应用 KGP。
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

// Capture the plugin directory before entering the host project's closures.
// The Gradle module name follows the Dart package name and may change between
// forks, so resolving libs through project(':ali_auth') is not reliable.
def pluginProjectDir = project.projectDir

// 阿里云认证 SDK 目前以三份本地 AAR 交付。Android Library 不能使用
// files(...) 直接打包本地 AAR，因此在 SDK 发布到 Maven 仓库前保留 flatDir。
rootProject.allprojects {
    repositories {
        mavenLocal()
        mavenCentral()
//        google()
//        jcenter()
        maven { url = uri('https://dl.bintray.com/jetbrains/anko') }
        maven { url = uri('https://download.flutter.io') }
        maven { url = uri('https://maven.aliyun.com/repository/public') }
        maven { url = uri('https://maven.aliyun.com/repository/google') }

        // 一键登录本地依赖
        flatDir {
            dirs new File(pluginProjectDir, 'libs')
        }
    }
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "com.sean.rao.ali_auth"
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdkVersion 21
    }

    aaptOptions {
        noCompress "mov"  //表示不让aapt压缩的文件后缀
    }

    buildTypes {
        release {
            debuggable false
            // minifyEnabled true
            proguardFile file('proguard-rules.pro')
            zipAlignEnabled false
            multiDexEnabled = true
        }

        debug {
            // minifyEnabled false
            zipAlignEnabled false
            multiDexEnabled = true
        }
    }

    dependencies {
        implementation "androidx.appcompat:appcompat:1.3.0"

        // 兼容安卓版本的fastjson库
        implementation "com.alibaba.fastjson2:fastjson2:2.0.51.android5"
        //    implementation 'com.google.code.gson:gson:2.10.1'
        //    implementation 'com.alibaba:fastjson:1.2.83'

        implementation(name: "auth_number_product-${authLibVersion}-release", ext:'aar')
        implementation(name: "logger-${loggerVersion}-release", ext:'aar')
        implementation(name: "main-${mainVersion}-release", ext:'aar')

        // 吐司框架：https://github.com/getActivity/Toaster
        // implementation 'com.github.getActivity:Toaster:12.2'

        // uc的crash收集库，客户可自行选择是否需要集成
        // implementation 'com.ucweb.wpk:crashsdk:3.2.2.2'
    }
}
